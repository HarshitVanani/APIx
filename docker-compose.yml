services:
  # 1. MongoDB Database Engine
  mongodb:
    image: mongo:7.0
    container_name: apix_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: apix_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - apix_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Cache
  redis:
    image: redis:7.2-alpine
    container_name: apix_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - apix_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Core FastAPI REST API Gateway
  backend_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: apix_backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/apix_db
      - DATABASE_NAME=apix_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - JWT_SECRET=super_secret_apix_development_key_2026
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apix_network

  # 4. Background Scraper & Scheduled Index Worker
  scraper_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: apix_scraper_worker
    restart: always
    command: ["python", "-m", "backend.tasks.scheduler"]
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/apix_db
      - DATABASE_NAME=apix_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apix_network

networks:
  apix_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data: