version: '3.8'

services:
  # Database
  mongo:
    image: mongo:6.0
    container_name: apix_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - apix_mongo_data:/data/db

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apix_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - JWT_SECRET=apix-in-production-secret-key-2026
    depends_on:
      - mongo

  # React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apix_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  apix_mongo_data: